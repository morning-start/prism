[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-client"
version = "0.1.0"
description = "Prism protocol-conversion gateway client (pluggable transports)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24",
    "websockets>=11",
]

[tool.setuptools]
packages = ["prism"]
