name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

# 同一分支的新提交自动取消进行中的旧运行，节省 runner 资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Check formatting
        run: moon fmt --check

  check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update dependencies
        run: moon update

      - name: Type check (warnings as errors)
        run: moon check --warn-list +73 --deny-warn

  test-native:
    name: Tests (native)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update dependencies
        run: moon update

      - name: Run tests (native)
        run: moon test --target native

  wasm:
    name: Build & Test (wasm-gc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update dependencies
        run: moon update

      - name: Build WASM (wasm-gc)
        run: moon build --target wasm-gc

      - name: Run tests (wasm-gc)
        run: moon test --target wasm-gc

  api:
    name: API Surface
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update dependencies
        run: moon update

      - name: API surface + interface drift check
        run: |
          moon info --target native
          git diff --exit-code -- '**/pkg.generated.mbti'

  wrappers:
    name: Wrapper Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update dependencies
        run: moon update

      - name: Build classic WASM (wrapper ABI)
        run: moon build --target wasm

      # --experimental-strip-types 需要 Node >= 22.6，显式固定版本，不依赖 runner 默认值
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Go wrapper integration test
        run: |
          cd wrappers/go
          go vet ./...
          go test -v ./...

      - name: TypeScript wrapper integration test
        run: |
          node --experimental-strip-types wrappers/ts/test/integration.test.ts

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: H10. Python wrapper integration test
        run: |
          cd wrappers/py
          PYTHONPATH=src uv run --frozen python - <<'EOF'
          import json
          from prism_wasm import PrismClient
          client = PrismClient('../../_build/wasm/debug/build/cmd/main/main.wasm')
          cap = client.capability('openai')
          assert cap['provider'] == 'openai' and 'model_pattern' in cap
          req = json.loads(client.encode_request('openai', 'Hello'))
          assert req['input'][0]['content'][0]['text'] == 'Hello'
          resp = json.dumps({'id':'1','object':'chat.completion','model':'gpt-4o','choices':[{'index':0,'message':{'role':'assistant','content':'Hi'},'finish_reason':'stop'}]})
          assert client.decode_response('openai-chat', resp) == 'Hi'
          print('python wrapper integration passed')
          EOF

      - name: H10b. Python wrapper test suite (pytest)
        run: |
          cd wrappers/py
          uv run --frozen pytest -q

      - name: H11. Transport daemon build + integration test
        run: |
          cd transport/daemon
          go vet ./...
          go test -v ./...
