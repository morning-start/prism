name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

# 同一分支的新提交自动取消进行中的旧运行，节省 runner 资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Check formatting
        run: moon fmt --check

  check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update dependencies
        run: moon update

      - name: Type check (warnings as errors)
        run: moon check --warn-list +73 --deny-warn

  test-native:
    name: Tests (native)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update dependencies
        run: moon update

      - name: Run tests (native)
        run: moon test --target native

  wasm:
    name: Build & Test (wasm-gc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update dependencies
        run: moon update

      - name: Build WASM (wasm-gc)
        run: moon build --target wasm-gc

      - name: Run tests (wasm-gc)
        run: moon test --target wasm-gc

  api:
    name: API Surface
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update dependencies
        run: moon update

      - name: API surface + interface drift check
        run: |
          moon info --target native
          git diff --exit-code -- '**/pkg.generated.mbti'

  coverage:
    name: Coverage Baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update dependencies
        run: moon update

      - name: Coverage regression check
        run: |
          moon coverage analyze 2>&1 | tee coverage.log
          UNCOVERED=$(grep -oE 'Total: [0-9]+ uncovered' coverage.log | grep -oE '[0-9]+' | head -1)
          echo "uncovered lines: ${UNCOVERED}"
          # 基线 888（2026-09-04，native 目标，wbtest 不参与统计）；允许 +15% 波动
          # 超过阈值说明新增代码未配测试，需要补测或显式更新基线
          if [ -n "${UNCOVERED}" ] && [ "${UNCOVERED}" -gt 1020 ]; then
            echo "::error::Coverage regression: ${UNCOVERED} uncovered lines (baseline 888, threshold 1020)"
            exit 1
          fi

  wrappers:
    name: Wrapper Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update dependencies
        run: moon update

      - name: Build classic WASM (wrapper ABI)
        run: moon build --target wasm

      # --experimental-strip-types 需要 Node >= 22.6，显式固定版本，不依赖 runner 默认值
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Go wrapper integration test
        run: |
          cd wrappers/go
          go vet ./...
          go test -v ./...

      - name: TypeScript wrapper integration test
        run: |
          node --experimental-strip-types wrappers/ts/test/integration.test.ts

      - name: H11. Transport daemon build + integration test
        run: |
          cd transport/daemon
          go vet ./...
          go test -v ./...
