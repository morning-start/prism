name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

# 同一分支的新提交自动取消进行中的旧运行，节省 runner 资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Check formatting
        run: moon fmt --check

  check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update dependencies
        run: moon update

      - name: Type check (warnings as errors)
        run: moon check --warn-list +73 --deny-warn

  test-native:
    name: Tests (native)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update dependencies
        run: moon update

      - name: Run tests (native)
        run: moon test --target native

  wasm:
    name: Build & Test (wasm-gc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update dependencies
        run: moon update

      - name: Build WASM (wasm-gc)
        run: moon build --target wasm-gc

      - name: Run tests (wasm-gc)
        run: moon test --target wasm-gc

  # WASM ABI 冒烟（TASK-2c / RISK-007）：moon test 的 wasm-gc runner 不校验
  # 主模块导出段，moonc 对 exports 清单里不存在的函数静默忽略——"测试全绿
  # 但产物无法加载"的假阴性已发生两次（POC-1 / P2-1）。本 job 是消费者侧
  # 防线：构建两后端产物 → Node 引擎加载 → 关键导出在位 + abi + 真实转换
  # + wasm-gc 降级语义/宿主契约/流会话 + wasm scratch 协议全断言。
  wasm-smoke:
    name: WASM ABI Smoke (Node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update dependencies
        run: moon update

      - name: Build both backends
        run: |
          moon build --target wasm
          moon build --target wasm-gc

      - name: Run WASM ABI smoke
        run: node scripts/wasm_smoke.mjs

  # TS wrapper 集成链路（TASK-5 / ACC-005）：构建 wasm-gc 产物 → ABI 冒烟 →
  # wrapper 编译（tsc）→ 16 项 Node 集成测试。独立 job 与主测试并行跑，
  # 失败只红本 job，不与 core 测试失败混淆；wrapper 测试内置产物缺失
  # fail-fast（ACC-001 CI 豁免项随本 job 上线关闭）。
  wrapper:
    name: TS Wrapper (build + integration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update dependencies
        run: moon update

      - name: Build wasm-gc artifact
        run: moon build --target wasm-gc

      - name: WASM ABI smoke (consumer-side guard)
        run: node scripts/wasm_smoke.mjs

      - name: Install wrapper dev dependencies
        working-directory: wrappers/ts
        run: npm ci

      - name: Compile wrapper (tsc)
        working-directory: wrappers/ts
        run: npm run build

      - name: Run wrapper integration tests
        working-directory: wrappers/ts
        run: npm test

  api:
    name: API Surface
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update dependencies
        run: moon update

      - name: API surface + interface drift check
        run: |
          moon info --target native
          git diff --exit-code -- '**/pkg.generated.mbti'

  conformance:
    name: Conformance (schema drift + property tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update dependencies
        run: moon update

      - name: Schema drift check (IR + adapter output fields, strict)
        shell: pwsh
        run: ./scripts/check_schema_drift.ps1 -Strict

      - name: Run conformance property tests (native)
        run: moon test --target native src/sdk/test

  # 官方 schema 校验：用三家官方 SDK 的类型定义当裁判，验证 Prism 产出会被真实
  # API 接受。这是 MoonBit 测试做不到的一层（它只能验证"自己跟自己一致"）。
  #
  # 覆盖四个维度（详见 tools/conformance/validate.mjs）：
  #   [1] 权威枚举 vs 仓库白名单 —— 抓"编造值 / 漏官方值"
  #   [2] 校验器自检           —— 证明裁判本身没有失效
  #   [3] 跨协议词汇泄漏       —— 抓 pause_turn 泄漏到 openai 这类问题
  #   [4] golden 回放          —— 用官方 spec 内嵌的真实样本回放
  oracle:
    name: Official Schema Oracle (Node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/conformance/package-lock.json

      - name: Install oracle dependencies
        working-directory: tools/conformance
        run: npm ci

      # oracle job 需要 MoonBit 工具链：步骤 5 会构建 js driver，
      # 让 Node 直接驱动真实转换管线（而非仅校验手写样本）
      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update dependencies
        run: moon update

      - name: Run all conformance checks (single entry, incl. real pipeline)
        run: node tools/conformance/run-all.mjs

      # golden/schema 是生成物且入库：若官方 SDK 升级导致枚举变化，git diff 会
      # 显式暴露，必须人工确认后提交 —— 避免"官方加了值但我们悄悄没跟上"。
      - name: Assert generated artifacts are up to date
        run: |
          git add -A tools/conformance/schemas fixtures/golden
          if ! git diff --cached --quiet; then
            echo "::error::生成的 schema/golden 与仓库不一致；请本地运行 node tools/conformance/run-all.mjs 后提交"
            git diff --cached --stat
            exit 1
          fi

  coverage:
    name: Coverage Baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update dependencies
        run: moon update

      - name: Coverage regression check
        run: |
          moon coverage analyze 2>&1 | tee coverage.log
          UNCOVERED=$(grep -oE 'Total: [0-9]+ uncovered' coverage.log | grep -oE '[0-9]+' | head -1)
          echo "uncovered lines: ${UNCOVERED}"
          # 基线 173（2026-09-22，native 目标，wbtest 不参与统计）；阈值 200
          # 2026-10-18 实测 198（流式会话化 P0/P1 修复后补测回到阈值内）
          # 2026-10-24 实测 203（CR-006 修复 +9 测试；阈值上调 200→204）。
          # 2026-10-24 四次实测 204（CR-007 legacy function_call 修复：新分支
          # 由 4 个 wbtest 对配平，含防御性闭块路径；阈值保持 204）。
          # 其中结构性不可测（不会因补测而下降，只会在新增代码时被突破）：
          #   src/examples/sdk-basic/main.mbt  82  println 演示体
          #   src/wasm/memory_linear.mbt      38  %identity 指针双关 ABI
          #   src/cmd/main/main.mbt           29  进程级 CLI 导出入口
          #   src/cmd/repl/driver_stub.mbt     1  非 js target 占位 main
          #   （另有 sdk/event_stream 等的零散分支洞，见 coverage 报告）
          # 超过阈值说明新增代码未配测试，需要补测或显式更新基线
          if [ -n "${UNCOVERED}" ] && [ "${UNCOVERED}" -gt 204 ]; then
            echo "::error::Coverage regression: ${UNCOVERED} uncovered lines (baseline 203, threshold 204)"
            exit 1
          fi

