name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update dependencies
        run: moon update

      - name: H1. Check formatting
        run: moon fmt --check

      - name: H2. Type check
        run: moon check --warn-list +73

      - name: H3. Run tests (native)
        run: moon test --target native

      - name: H4. Build WASM (wasm-gc)
        run: moon build --target wasm-gc

      - name: H5. Run tests (wasm-gc)
        run: moon test --target wasm-gc

      - name: H6. API surface + interface drift check
        run: |
          moon info --target native
          git diff --exit-code -- '**/pkg.generated.mbti'
