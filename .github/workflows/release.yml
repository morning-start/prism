name: Release WASM

# 推送 v* 标签（如 v0.1.4）时：验证 → 构建 classic wasm → 发布为 GitHub Release 资产
on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    name: Quality Gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update dependencies
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Type check (warnings as errors)
        run: moon check --warn-list +73 --deny-warn

      - name: Run tests (native)
        run: moon test --target native

  release:
    name: Build & Publish WASM
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Update dependencies
        run: moon update

      - name: Build classic WASM (wrapper ABI)
        run: moon build --target wasm

      - name: Stage release artifact
        run: |
          set -euo pipefail
          WASM="_build/wasm/debug/build/cmd/main/main.wasm"
          if [ ! -f "$WASM" ]; then
            # 防御性回退：产物路径随 moon 版本可能变化
            WASM="$(find _build target -path '*build/cmd/main/main.wasm' -name '*.wasm' 2>/dev/null | head -1)"
          fi
          if [ -z "$WASM" ] || [ ! -f "$WASM" ]; then
            echo "::error::WASM artifact not found after moon build"
            exit 1
          fi
          cp "$WASM" prism.wasm
          sha256sum prism.wasm > prism.wasm.sha256
          echo "Artifact: prism.wasm ($(stat -c%s prism.wasm) bytes)"
          cat prism.wasm.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            Prism ${{ github.ref_name }} — classic wasm 构建（wrapper ABI）。

            - `prism.wasm`：Go / TypeScript wrapper 加载的运行时产物
            - `prism.wasm.sha256`：产物校验和
          files: |
            prism.wasm
            prism.wasm.sha256
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
