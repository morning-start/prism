[project]
name = "prism-wasm"
version = "0.1.0"
description = "Prism LLM protocol converter - universal WASM wrapper"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "ai", "protocol", "converter", "wasm"]

authors = [
  { name = "morning-start" },
]

dependencies = [
  "wasmtime>=20.0.0",
]

[project.urls]
Homepage = "https://github.com/morning-start/prism"
Repository = "https://github.com/morning-start/prism"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prism_wasm"]

[tool.hatch.build]
include = [
  "src/**",
  "prism.wasm",
]

[tool.uv]
dev-dependencies = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
