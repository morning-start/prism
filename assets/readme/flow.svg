<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">Prism 代码架构</title>
  <desc id="desc">四层架构：L0 lux 提供 Lucent IR 中立核心；L1 provider 放 4 个协议适配器（openai / responses / messages / gemini，各 6 个纯函数）；L2 sdk 做注册表路由与 Prism 门面；L3 wasm 与 cmd/main 导出字符串 ABI；internal 提供共享基元，另有 conformance 验证器与 Go/TS wrapper。</desc>

  <!-- Background -->
  <rect width="1200" height="560" fill="#0d1117" rx="20"/>

  <!-- Title -->
  <text x="64" y="66" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="30" font-weight="700" fill="#e6edf3">代码架构</text>
  <text x="64" y="94" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="16" fill="#8b949e">L0 → L3 分层：中立核心 · 协议适配 · SDK 收敛 · WASM 导出</text>

  <!-- ===== LAYER 0: lux ===== -->
  <rect x="64" y="116" width="1072" height="72" rx="8" fill="#1c2333" stroke="#30363d" stroke-width="1"/>
  <rect x="64" y="116" width="190" height="72" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="159" y="151" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="19" font-weight="700" fill="#58a6ff">L0 · lux/</text>
  <text x="159" y="175" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="15" fill="#8b949e">Lucent IR 核心</text>

  <text x="278" y="150" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="16" fill="#e6edf3">LucentRequest · LucentResponse · LucentStreamEvent</text>
  <text x="278" y="174" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="16" fill="#8b949e">类型 + 序列化 + 诊断 + 流事件 —— 标准 / 扩展字段分级</text>
  <rect x="982" y="128" width="138" height="28" rx="6" fill="#1f2937" stroke="#30363d" stroke-width="1"/>
  <text x="1051" y="147" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="14" fill="#58a6ff">无 IO · 无厂商绑定</text>

  <!-- Arrow L0 → L1 -->
  <line x1="600" y1="190" x2="600" y2="200" stroke="#30363d" stroke-width="2"/>
  <polygon points="600,200 594,206 606,206" fill="#30363d"/>

  <!-- ===== LAYER 1: provider adapters ===== -->
  <rect x="64" y="212" width="1072" height="104" rx="8" fill="#1c2333" stroke="#30363d" stroke-width="1"/>
  <rect x="64" y="212" width="190" height="104" rx="8" fill="#0d1117" stroke="#f0883e" stroke-width="2"/>
  <text x="159" y="256" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="19" font-weight="700" fill="#f0883e">L1 · provider/</text>
  <text x="159" y="280" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="15" fill="#8b949e">4 协议 · 每端 6 函数</text>

  <!-- Provider cards (name + protocol) -->
  <g>
    <rect x="278" y="222" width="201" height="84" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="294" y="256" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="19" font-weight="700" fill="#58a6ff">openai</text>
    <text x="294" y="290" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="18" fill="#8b949e">Chat Completions</text>

    <rect x="496" y="222" width="201" height="84" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="512" y="256" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="19" font-weight="700" fill="#d2a8ff">responses</text>
    <text x="512" y="290" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="18" fill="#8b949e">Responses API</text>

    <rect x="714" y="222" width="201" height="84" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="730" y="256" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="19" font-weight="700" fill="#f0883e">messages</text>
    <text x="730" y="290" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="18" fill="#8b949e">Messages API</text>

    <rect x="932" y="222" width="188" height="84" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="948" y="256" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="19" font-weight="700" fill="#7ee787">gemini</text>
    <text x="948" y="290" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="18" fill="#8b949e">Gemini API</text>
  </g>

  <!-- Arrow L1 → L2 -->
  <line x1="600" y1="318" x2="600" y2="328" stroke="#30363d" stroke-width="2"/>
  <polygon points="600,328 594,334 606,334" fill="#30363d"/>

  <!-- ===== LAYER 2: sdk ===== -->
  <rect x="64" y="340" width="1072" height="72" rx="8" fill="#1c2333" stroke="#30363d" stroke-width="1"/>
  <rect x="64" y="340" width="190" height="72" rx="8" fill="#0d1117" stroke="#7ee787" stroke-width="2"/>
  <text x="159" y="375" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="19" font-weight="700" fill="#7ee787">L2 · sdk/</text>
  <text x="159" y="399" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="15" fill="#8b949e">门面 + 注册表</text>

  <text x="278" y="374" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="16" fill="#e6edf3">Prism 门面 · ProviderRegistration · Context · PrismEvent</text>
  <text x="278" y="398" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="16" fill="#8b949e">注册表调度 + 模型名路由（match_by_model）—— 新增协议只改 1 处</text>
  <rect x="982" y="352" width="138" height="28" rx="6" fill="#1f2937" stroke="#30363d" stroke-width="1"/>
  <text x="1051" y="371" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="14" fill="#7ee787">唯一收敛点</text>

  <!-- Arrow L2 → L3 -->
  <line x1="600" y1="414" x2="600" y2="424" stroke="#30363d" stroke-width="2"/>
  <polygon points="600,424 594,430 606,430" fill="#30363d"/>

  <!-- ===== LAYER 3: wasm ===== -->
  <rect x="64" y="436" width="1072" height="72" rx="8" fill="#1c2333" stroke="#30363d" stroke-width="1"/>
  <rect x="64" y="436" width="190" height="72" rx="8" fill="#0d1117" stroke="#d2a8ff" stroke-width="2"/>
  <text x="159" y="471" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="19" font-weight="700" fill="#d2a8ff">L3 · wasm/</text>
  <text x="159" y="495" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="15" fill="#8b949e">cmd/main 汇出</text>

  <text x="278" y="470" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="16" fill="#e6edf3">字符串 ABI 导出 · scratch 内存 · 日志缓冲</text>
  <text x="278" y="494" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="16" fill="#8b949e">wasm_to_lux_req · wasm_sdk_encode_request · wasm_sse_to_events · …</text>
  <rect x="982" y="448" width="138" height="28" rx="6" fill="#1f2937" stroke="#30363d" stroke-width="1"/>
  <text x="1051" y="467" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="14" fill="#d2a8ff">String 进出</text>

  <!-- ===== Bottom: shared base + companions ===== -->
  <rect x="64" y="516" width="1072" height="34" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="278" y="538" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="15" fill="#e6edf3">internal/ 共享基元：JSON 字段访问 · SSE 帧解析 · extras 合并 · usage 解析</text>
</svg>
