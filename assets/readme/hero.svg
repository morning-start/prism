<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">Prism — 一套中立 IR，互通所有 LLM 协议</title>
  <desc id="desc">Prism 是 MoonBit 编写的 LLM 协议转换引擎：OpenAI Chat、OpenAI Responses、Anthropic Messages、Google Gemini 四类协议 JSON 与 SSE 经中立中间表示 Lucent IR 双向互转；请求、响应、流式全覆盖，能力差异显式诊断。</desc>

  <!-- Background -->
  <rect width="1200" height="420" fill="#0d1117" rx="20"/>

  <!-- ===== LEFT: title block ===== -->
  <g id="title-block">
    <text x="64" y="90" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="16" fill="#8b949e" letter-spacing="0.5">morning-start/prism · MoonBit</text>
    <text x="60" y="172" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="80" font-weight="800" fill="#f0f6fc" letter-spacing="-2">Prism</text>
    <text x="64" y="216" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="27" font-weight="600" fill="#e6edf3">一套中立 IR，互通所有 LLM 协议</text>
    <text x="64" y="253" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="17" fill="#8b949e">把 OpenAI、Anthropic、Gemini 的请求、响应与 SSE 流</text>
    <text x="64" y="279" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="17" fill="#8b949e">统一成一层 Lucent IR —— 换厂商只改一个名字。</text>
  </g>

  <!-- Chips -->
  <g id="fact-chips" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="16" fill="#e6edf3">
    <rect x="64" y="308" width="136" height="32" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="82" y="329">4 协议适配器</text>
    <rect x="212" y="308" width="146" height="32" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="230" y="329">800+ 测试用例</text>
    <rect x="370" y="308" width="182" height="32" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="388" y="329">Native + wasm-gc</text>
  </g>

  <!-- ===== RIGHT: prism emblem — four protocols through Lucent IR ===== -->
  <g id="prism-emblem">
    <!-- Hexagon hub -->
    <polygon points="920,130 1026,171 1026,301 920,342 814,301 814,171" fill="#161b22" stroke="#e6edf3" stroke-width="2"/>

    <!-- Protocol beams (drawn above the hub fill, crossing it) -->
    <g stroke-width="2.5" stroke-linecap="round">
      <!-- OpenAI Chat -->
      <line x1="824" y1="194" x2="1040" y2="194" stroke="#58a6ff"/>
      <!-- OpenAI Responses -->
      <line x1="824" y1="234" x2="1040" y2="234" stroke="#d2a8ff"/>
      <!-- Anthropic Messages -->
      <line x1="824" y1="274" x2="1040" y2="274" stroke="#f0883e"/>
      <!-- Google Gemini -->
      <line x1="824" y1="314" x2="1040" y2="314" stroke="#7ee787"/>
    </g>

    <!-- Enter / exit arrowheads -->
    <g>
      <polygon points="824,188 812,194 824,200" fill="#58a6ff"/>
      <polygon points="1040,188 1052,194 1040,200" fill="#58a6ff"/>
      <polygon points="824,228 812,234 824,240" fill="#d2a8ff"/>
      <polygon points="1040,228 1052,234 1040,240" fill="#d2a8ff"/>
      <polygon points="824,268 812,274 824,280" fill="#f0883e"/>
      <polygon points="1040,268 1052,274 1040,280" fill="#f0883e"/>
      <polygon points="824,308 812,314 824,320" fill="#7ee787"/>
      <polygon points="1040,308 1052,314 1040,320" fill="#7ee787"/>
    </g>

    <!-- Protocol labels (right-aligned before the hub) -->
    <g font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="17">
      <text x="810" y="178" text-anchor="end" fill="#58a6ff">OpenAI Chat</text>
      <text x="810" y="218" text-anchor="end" fill="#d2a8ff">OpenAI Responses</text>
      <text x="810" y="258" text-anchor="end" fill="#f0883e">Anthropic Messages</text>
      <text x="810" y="298" text-anchor="end" fill="#7ee787">Google Gemini</text>
    </g>

    <!-- Hub label chip -->
    <rect x="835" y="218" width="170" height="42" rx="9" fill="#0d1117" stroke="#f0883e" stroke-width="1.5"/>
    <text x="920" y="245" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="21" font-weight="700" fill="#f0f6fc">Lucent IR</text>
  </g>

  <!-- Bottom strip -->
  <text x="600" y="398" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="16" fill="#8b949e">请求 · 响应 · 流式（SSE）全覆盖 —— 任一端都可作为入口或出口</text>
</svg>
