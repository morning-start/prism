<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%">
  <title>Prism — LLM 统一协议中间件</title>
  <desc>Prism：通过中立中间协议 Lucent IR，统一所有 LLM 厂商协议。Provider JSON ↔ Lucent IR ↔ Provider JSON 双向转换。</desc>

  <!-- Background -->
  <rect width="1200" height="380" fill="#0d1117" rx="12"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#e6edf3" stroke-width="0.5"/>
    <line x1="0" y1="40" x2="1200" y2="40" stroke="#e6edf3" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#e6edf3" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#e6edf3" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="1200" y2="160" stroke="#e6edf3" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#e6edf3" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#e6edf3" stroke-width="0.5"/>
    <line x1="0" y1="280" x2="1200" y2="280" stroke="#e6edf3" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="1200" y2="320" stroke="#e6edf3" stroke-width="0.5"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#e6edf3" stroke-width="0.5"/>
  </g>

  <!-- ===== LEFT SECTION: Title ===== -->

  <!-- Repository name -->
  <text x="70" y="100" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="56" font-weight="700" fill="#e6edf3" letter-spacing="-1">morning‑start/prism</text>

  <!-- Subtitle -->
  <text x="70" y="148" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="28" font-weight="500" fill="#8b949e">LLM 统一协议中间件</text>

  <!-- Description -->
  <text x="70" y="188" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="16" fill="#8b949e">一套统一 API 调用任意 LLM 厂商，无需分别适配各家协议。</text>
  <text x="70" y="212" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="16" fill="#8b949e">Lucent IR 中立中间协议 · 一次适配，全协议互通。</text>

  <!-- Tags -->
  <g transform="translate(70, 250)">
    <rect x="0" y="0" width="90" height="26" rx="6" fill="#1f2937" stroke="#30363d" stroke-width="1"/>
    <text x="12" y="18" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="12" fill="#58a6ff">7 Providers</text>

    <rect x="102" y="0" width="90" height="26" rx="6" fill="#1f2937" stroke="#30363d" stroke-width="1"/>
    <text x="117" y="18" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="12" fill="#f0883e">301 Tests</text>

    <rect x="204" y="0" width="90" height="26" rx="6" fill="#1f2937" stroke="#30363d" stroke-width="1"/>
    <text x="219" y="18" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="12" fill="#7ee787">WASM Core</text>

    <rect x="306" y="0" width="80" height="26" rx="6" fill="#1f2937" stroke="#30363d" stroke-width="1"/>
    <text x="315" y="18" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="12" fill="#d2a8ff">O(N) Cost</text>
  </g>

  <!-- ===== RIGHT SECTION: Architecture Thumbnail ===== -->

  <g transform="translate(590, 60)">

    <!-- Left box: Provider JSON -->
    <rect x="0" y="80" width="150" height="120" rx="10" fill="#1c2333" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="75" y="118" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="13" fill="#58a6ff" text-anchor="middle" font-weight="600">Provider JSON</text>
    <text x="75" y="140" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">OpenAI / Anthropic</text>
    <text x="75" y="158" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Gemini / Azure / …</text>
    <text x="75" y="180" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#484f58" text-anchor="middle">decode  ←  encode</text>

    <!-- Arrow left → center -->
    <line x1="150" y1="140" x2="195" y2="140" stroke="#58a6ff" stroke-width="2"/>
    <polygon points="195,133 205,140 195,147" fill="#58a6ff"/>

    <!-- Center box: Lucent IR (prism shape - hexagon) -->
    <polygon points="220,65 295,65 335,140 295,215 220,215 180,140" fill="#0d1117" stroke="#f0883e" stroke-width="2"/>
    <text x="257" y="130" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="12" fill="#f0883e" text-anchor="middle" font-weight="600">Lucent</text>
    <text x="257" y="150" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="12" fill="#f0883e" text-anchor="middle" font-weight="600">IR</text>

    <!-- Light rays through prism -->
    <g opacity="0.15">
      <line x1="180" y1="140" x2="205" y2="140" stroke="#f0883e" stroke-width="2"/>
      <line x1="335" y1="140" x2="360" y2="140" stroke="#f0883e" stroke-width="2"/>
      <line x1="180" y1="140" x2="205" y2="120" stroke="#58a6ff" stroke-width="1.5"/>
      <line x1="180" y1="140" x2="205" y2="160" stroke="#7ee787" stroke-width="1.5" opacity="0.5"/>
      <line x1="335" y1="140" x2="360" y2="120" stroke="#58a6ff" stroke-width="1.5"/>
      <line x1="335" y1="140" x2="360" y2="160" stroke="#7ee787" stroke-width="1.5" opacity="0.5"/>
    </g>

    <!-- Arrow center → right -->
    <line x1="335" y1="140" x2="380" y2="140" stroke="#f0883e" stroke-width="2"/>
    <polygon points="380,133 390,140 380,147" fill="#f0883e"/>

    <!-- Right box: Provider JSON -->
    <rect x="390" y="80" width="150" height="120" rx="10" fill="#1c2333" stroke="#f0883e" stroke-width="1.5"/>
    <text x="465" y="118" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="13" fill="#f0883e" text-anchor="middle" font-weight="600">Provider JSON</text>
    <text x="465" y="140" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">OpenAI / Anthropic</text>
    <text x="465" y="158" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Gemini / Azure / …</text>
    <text x="465" y="180" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#484f58" text-anchor="middle">encode  →  decode</text>

    <!-- Bottom: "O(N) instead of O(N²)" -->
    <text x="257" y="262" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="14" fill="#d2a8ff" text-anchor="middle" font-weight="600">O(N) ↔ O(N²)</text>
    <text x="257" y="282" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="12" fill="#484f58" text-anchor="middle">N 个协议只需 N 次双向适配</text>
  </g>

</svg>
